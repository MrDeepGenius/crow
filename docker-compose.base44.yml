services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    restart: unless-stopped

volumes:
  node_modules:
